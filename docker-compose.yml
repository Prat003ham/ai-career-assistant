version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_career_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_career_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_career_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=heuristic
      - AI_SERVICE_PORT=8000
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_career_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=super_secret_jwt_key_ai_career_assistant_2026
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_career_assistant
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_career_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
